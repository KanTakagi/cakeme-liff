<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <base target="_top">
  <!-- shared_head.html — LIFFページ共通スタイル（白背景×CAKEMEグリーン・モバイル縦） -->
<style>
  :root {
    --green: #0C6B41;
    --green-btn: #1FA36B;
    --gray: #5B6B62;
    --line: #e6ebe8;
    --bg: #ffffff;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans Thai", sans-serif;
    color: #1a2621; background: var(--bg);
    font-size: 15px; line-height: 1.6;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 18px 120px; }
  header.app { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  header.app .logo { color: var(--green); font-weight: 700; font-size: 18px; }
  h1 { font-size: 18px; margin: 4px 0 12px; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: var(--green); }
  p.note { font-size: 13px; color: var(--gray); margin: 4px 0 16px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--gray); margin-bottom: 5px; }
  label .req { color: var(--danger); }
  input, select, textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 15px; font-family: inherit; background: #fff; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--green-btn); }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; }
  button {
    font-family: inherit; font-size: 15px; font-weight: 600; border: none;
    border-radius: 12px; padding: 13px 16px; cursor: pointer;
  }
  .btn-primary { background: var(--green-btn); color: #fff; width: 100%; }
  .btn-primary:active { opacity: .85; }
  .btn-ghost { background: #fff; color: var(--green); border: 1px solid var(--line); }
  .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
  .footer-fix {
    position: fixed; left: 0; right: 0; bottom: 0; background: #fff;
    border-top: 1px solid var(--line); padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  }
  .footer-fix .inner { max-width: 480px; margin: 0 auto; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { flex: 1; background: #f4f7f5; color: var(--gray); border-radius: 10px; padding: 9px; }
  .tabs button.on { background: var(--green); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--gray); font-weight: 600; font-size: 12px; }
  .list-item { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list-item .name { flex: 1; font-weight: 600; }
  .list-item .date { color: var(--gray); font-size: 13px; }
  .muted { color: var(--gray); }
  .err { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .ok-box { text-align: center; padding: 40px 20px; }
  .ok-box .big { font-size: 40px; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: #1a2621; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: .95; }
  .hidden { display: none !important; }
  .chip { display:inline-block; background:#f4f7f5; border-radius:8px; padding:3px 8px; font-size:12px; color:var(--gray); }
</style>

  <style>
    .cake-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cake-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; background: #fff; }
    .cake-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #f4f7f5; }
    .cake-card .cbody { padding: 8px 10px; }
    .cake-card .cname { font-weight: 600; font-size: 13px; line-height: 1.3; }
    .cake-card .cprice { color: var(--gray); font-size: 12px; margin-top: 2px; }
    .seg { display: flex; gap: 6px; flex-wrap: wrap; }
    .seg button { flex: 1; min-width: 64px; background: #f4f7f5; color: var(--gray); border-radius: 9px; padding: 9px; }
    .seg button.on { background: var(--green); color: #fff; }
    .qty { display: flex; align-items: center; gap: 14px; }
    .qty button { width: 44px; height: 44px; border-radius: 10px; background: #f4f7f5; color: var(--green); font-size: 22px; }
    .qty span { font-size: 20px; font-weight: 700; min-width: 32px; text-align: center; }
    .sum { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
    .sum.total { font-weight: 700; font-size: 16px; }
    .tmpl { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .tmpl button { background: #f4f7f5; color: var(--green); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
    /* カート */
    .cart-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .cart-item .ci-body { flex: 1; }
    .cart-item .ci-name { font-weight: 600; font-size: 14px; }
    .cart-item .ci-sub { color: var(--gray); font-size: 12px; margin-top: 2px; }
    .cart-item .ci-price { font-weight: 600; font-size: 14px; }
    .cart-item .ci-del { color: var(--danger); font-size: 20px; cursor: pointer; padding: 0 4px; }
    .cart-empty { color: var(--gray); font-size: 13px; padding: 8px 0; }
    /* モーダル */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 100; }
    .modal-bg.show { display: block; }
    .sheet { display: none; position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; background: #fff;
      border-radius: 18px 18px 0 0; padding: 16px 18px calc(18px + env(safe-area-inset-bottom)); z-index: 101; max-height: 88vh; overflow-y: auto; }
    .sheet.show { display: block; }
    .sheet .m-img { width: 120px; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; float: right; margin: 0 0 8px 12px; }
    .sheet h3 { margin: 0 0 2px; font-size: 17px; }
    .m-close { position: absolute; top: 12px; right: 14px; font-size: 22px; color: var(--gray); cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap" id="app" style="display:none">
    <header class="app"><span class="logo">🎂 CAKEME</span></header>
    <h1 id="title">誕生日ケーキの注文</h1>
    <p class="note" id="target"></p>

    <h2>🛒 選んだケーキ</h2>
    <div id="cart"></div>

    <h2>ケーキを追加（タップで選択）</h2>
    <div class="cake-grid" id="cakes"></div>

    <h2>メッセージプレート</h2>
    <div class="field">
      <input id="plateText" type="text" maxlength="40" placeholder="Happy Birthday!">
      <div class="tmpl" id="tmpls"></div>
    </div>

    <h2>お届け</h2>
    <div class="field"><label>配達先</label><select id="siteId"></select></div>
    <div class="field"><label>時間帯</label><select id="timeWindow"></select></div>
    <p class="note" id="delivery-date"></p>

    <div id="err" class="err hidden"></div>
  </div>

  <div class="footer-fix" id="footer" style="display:none">
    <div class="inner">
      <div class="sum"><span>小計</span><span id="s-sub">0 THB</span></div>
      <div class="sum"><span>配送料</span><span id="s-fee">0 THB</span></div>
      <div class="sum total"><span>合計</span><span id="s-total">0 THB</span></div>
      <button class="btn-primary" id="confirm" style="margin-top:8px">注文を確定する</button>
    </div>
  </div>

  <!-- ケーキ詳細モーダル -->
  <div class="modal-bg" id="modal-bg"></div>
  <div class="sheet" id="sheet">
    <span class="m-close" id="m-close">×</span>
    <img id="m-img" class="m-img" alt="">
    <h3 id="m-name"></h3>
    <p class="note" id="m-price" style="margin:0 0 12px"></p>
    <h2 style="margin-top:6px">サイズ</h2>
    <div class="seg" id="m-sizes"></div>
    <h2>フィリング（中身）</h2>
    <div class="field"><select id="m-filling"></select></div>
    <h2>個数</h2>
    <div class="qty">
      <button type="button" id="m-minus">−</button>
      <span id="m-qval">1</span>
      <button type="button" id="m-plus">＋</button>
    </div>
    <button class="btn-primary" id="m-add" style="margin-top:16px">🛒 カートに追加</button>
  </div>

  <div class="wrap ok-box hidden" id="done">
    <div class="big">✅</div><h1>注文を確定しました</h1>
    <p class="note" id="done-msg"></p>
    <p class="note">確認内容と支払いQRをLINEにお送りしました。</p>
    <button class="btn-primary" onclick="CAKEME.close()">閉じる</button>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="./config.js"></script><script src="./shared_liff_web.js"></script>
  <script>
    var D = null, cart = [], work = { cakeId: '', size: '', filling: '', qty: 1 };
    var LIFF_PARAMS = null;
    var draftId = (LIFF_PARAMS && LIFF_PARAMS.draft) || new URLSearchParams(location.search).get('draft');

    CAKEME.init(function () {
      if (!draftId) { showFatal('注文が指定されていません'); return; }
      CAKEME.call('getOrderDraft', { draftId: draftId }).then(function (d) {
        D = d;
        if (!d.editable) { showFatal('この注文はすでに確定/処理済みです'); return; }
        setup();
      }).catch(function (e) { showFatal(e.message); });
    });

    function menuOf(id) { return D.menu.filter(function (m) { return m.cakeId === id; })[0]; }
    function priceOf(id, size) { var m = menuOf(id); if (!m) return 0; var s = m.sizes.filter(function (x) { return x.size === size; })[0]; return s ? s.price : 0; }

    function setup() {
      var o = D.order;
      cart = (o.items || []).map(function (it) { return { cakeId: it.cakeId, size: it.size, filling: it.filling || (D.fillings[0] || ''), qty: Math.max(1, it.qty || 1) }; });
      document.getElementById('target').textContent = o.employeeName + ' さん / お届け ' + o.deliveryDate;
      document.getElementById('delivery-date').textContent = '配達日: ' + o.deliveryDate + '（固定）';
      document.getElementById('plateText').value = o.plateText || '';

      document.getElementById('cakes').innerHTML = D.menu.map(function (m) {
        var minP = Math.min.apply(null, m.sizes.map(function (s) { return s.price; }));
        var img = m.imageUrl ? '<img src="' + esc(m.imageUrl) + '" loading="lazy" alt="">' : '';
        return '<div class="cake-card" data-cake="' + esc(m.cakeId) + '">' + img +
          '<div class="cbody"><div class="cname">' + esc(m.name) + '</div>' +
          '<div class="cprice">' + minP + ' THB〜</div></div></div>';
      }).join('');
      document.querySelectorAll('[data-cake]').forEach(function (el) {
        el.addEventListener('click', function () { openModal(el.getAttribute('data-cake')); });
      });

      document.getElementById('tmpls').innerHTML = (D.plateTemplates || []).map(function (t) {
        return '<button data-tmpl="' + esc(t) + '">' + esc(t) + '</button>';
      }).join('');
      document.querySelectorAll('[data-tmpl]').forEach(function (b) {
        b.addEventListener('click', function () { document.getElementById('plateText').value = b.getAttribute('data-tmpl'); });
      });

      document.getElementById('siteId').innerHTML = D.sites.map(function (s) {
        return '<option value="' + esc(s.siteId) + '">' + esc(s.siteName) + '</option>';
      }).join('') || '<option value="">（拠点未登録）</option>';
      document.getElementById('siteId').value = o.siteId || '';
      document.getElementById('siteId').addEventListener('change', renderCart);
      document.getElementById('timeWindow').innerHTML = (D.timeWindows || []).map(function (t) {
        return '<option value="' + esc(t) + '">' + esc(t) + '</option>';
      }).join('');
      document.getElementById('timeWindow').value = o.timeWindow || '';

      renderCart();
      document.getElementById('app').style.display = '';
      document.getElementById('footer').style.display = '';
    }

    // ---- モーダル ----
    function openModal(cakeId) {
      var m = menuOf(cakeId); if (!m) return;
      work = { cakeId: cakeId, size: (m.sizes[0] ? m.sizes[0].size : ''), filling: (D.fillings[0] || ''), qty: 1 };
      document.getElementById('m-img').src = m.imageUrl || '';
      document.getElementById('m-name').textContent = m.name;
      var mf = document.getElementById('m-filling');
      mf.innerHTML = ((D.fillings && D.fillings.length) ? D.fillings : ['(なし)']).map(function (f) { return '<option>' + esc(f) + '</option>'; }).join('');
      if (!mf.value && mf.options.length) mf.selectedIndex = 0;
      work.filling = mf.value;
      document.getElementById('m-qval').textContent = work.qty;
      renderModalSizes(); renderModalPrice();
      document.getElementById('modal-bg').classList.add('show');
      document.getElementById('sheet').classList.add('show');
    }
    function closeModal() {
      document.getElementById('modal-bg').classList.remove('show');
      document.getElementById('sheet').classList.remove('show');
    }
    function renderModalSizes() {
      var m = menuOf(work.cakeId), sizes = m ? m.sizes : [];
      if (!sizes.some(function (s) { return s.size === work.size; })) work.size = sizes[0] ? sizes[0].size : '';
      document.getElementById('m-sizes').innerHTML = sizes.map(function (s) {
        return '<button data-msize="' + esc(s.size) + '">' + esc(s.size) + '<br><span style="font-size:11px">' + esc(s.serves) + '</span></button>';
      }).join('');
      document.querySelectorAll('[data-msize]').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-msize') === work.size);
        b.addEventListener('click', function () { work.size = b.getAttribute('data-msize'); renderModalSizes(); renderModalPrice(); });
      });
    }
    function renderModalPrice() {
      document.getElementById('m-price').textContent = priceOf(work.cakeId, work.size) + ' THB × ' + work.qty + ' = ' + (priceOf(work.cakeId, work.size) * work.qty) + ' THB';
    }
    document.getElementById('m-filling').addEventListener('change', function () { work.filling = this.value; });
    document.getElementById('m-minus').addEventListener('click', function () { work.qty = Math.max(1, work.qty - 1); document.getElementById('m-qval').textContent = work.qty; renderModalPrice(); });
    document.getElementById('m-plus').addEventListener('click', function () { work.qty = Math.min(99, work.qty + 1); document.getElementById('m-qval').textContent = work.qty; renderModalPrice(); });
    document.getElementById('m-close').addEventListener('click', closeModal);
    document.getElementById('modal-bg').addEventListener('click', closeModal);
    document.getElementById('m-add').addEventListener('click', function () {
      cart.push({ cakeId: work.cakeId, size: work.size, filling: work.filling, qty: work.qty });
      closeModal(); renderCart();
      CAKEME.toast('カートに追加しました');
    });

    // ---- カート表示 ----
    function renderCart() {
      var el = document.getElementById('cart');
      if (!cart.length) { el.innerHTML = '<p class="cart-empty">下のケーキをタップして追加してください</p>'; }
      else {
        el.innerHTML = cart.map(function (it, i) {
          var m = menuOf(it.cakeId);
          var line = priceOf(it.cakeId, it.size) * it.qty;
          return '<div class="cart-item">' +
            '<div class="ci-body"><div class="ci-name">' + esc(m ? m.name : it.cakeId) + '（' + esc(it.size) + '）× ' + it.qty + '</div>' +
            '<div class="ci-sub">中身: ' + esc(it.filling || '-') + '</div></div>' +
            '<div class="ci-price">' + line + ' THB</div>' +
            '<span class="ci-del" data-del="' + i + '">×</span></div>';
        }).join('');
        el.querySelectorAll('[data-del]').forEach(function (b) {
          b.addEventListener('click', function () { cart.splice(Number(b.getAttribute('data-del')), 1); renderCart(); });
        });
      }
      // 合計
      var sub = 0; cart.forEach(function (it) { sub += priceOf(it.cakeId, it.size) * it.qty; });
      var siteId = document.getElementById('siteId').value;
      var site = D.sites.filter(function (s) { return s.siteId === siteId; })[0];
      var fee = (site && site.deliveryFee !== '' && site.deliveryFee != null) ? Number(site.deliveryFee) : 0;
      if (sub >= D.freeDeliveryMin) fee = 0;
      document.getElementById('s-sub').textContent = sub + ' THB';
      document.getElementById('s-fee').textContent = fee + ' THB';
      document.getElementById('s-total').textContent = (sub + fee) + ' THB';
    }

    document.getElementById('confirm').addEventListener('click', function () {
      var btn = this;
      if (!cart.length) { CAKEME.toast('ケーキを追加してください'); return; }
      var changes = {
        items: cart,
        plateText: document.getElementById('plateText').value.trim(),
        siteId: document.getElementById('siteId').value,
        timeWindow: document.getElementById('timeWindow').value
      };
      CAKEME.withLoading(btn, function () {
        return CAKEME.call('confirmOrder', { draftId: draftId, changes: changes }).then(function (res) {
          document.getElementById('app').style.display = 'none';
          document.getElementById('footer').style.display = 'none';
          document.getElementById('done').classList.remove('hidden');
          document.getElementById('done-msg').textContent = '注文番号 ' + res.orderId + ' / 合計 ' + res.total + ' THB';
        });
      });
    });

    function showFatal(m) { document.body.innerHTML = '<div class="wrap"><header class="app"><span class="logo">🎂 CAKEME</span></header><p class="err">' + esc(m) + '</p><button class="btn-ghost" onclick="CAKEME.close()">閉じる</button></div>'; }
  </script>
</body>
</html>
