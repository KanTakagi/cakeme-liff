<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <!-- shared_head.html — LIFFページ共通スタイル（白背景×CAKEMEグリーン・モバイル縦） -->
<style>
  :root {
    --green: #0C6B41;
    --green-btn: #1FA36B;
    --gray: #5B6B62;
    --line: #e6ebe8;
    --bg: #ffffff;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans Thai", sans-serif;
    color: #1a2621; background: var(--bg);
    font-size: 15px; line-height: 1.6;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 18px 120px; }
  header.app { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  header.app .logo { color: var(--green); font-weight: 700; font-size: 18px; }
  h1 { font-size: 18px; margin: 4px 0 12px; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: var(--green); }
  p.note { font-size: 13px; color: var(--gray); margin: 4px 0 16px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--gray); margin-bottom: 5px; }
  label .req { color: var(--danger); }
  input, select, textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 15px; font-family: inherit; background: #fff; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--green-btn); }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; }
  button {
    font-family: inherit; font-size: 15px; font-weight: 600; border: none;
    border-radius: 12px; padding: 13px 16px; cursor: pointer;
  }
  .btn-primary { background: var(--green-btn); color: #fff; width: 100%; }
  .btn-primary:active { opacity: .85; }
  .btn-ghost { background: #fff; color: var(--green); border: 1px solid var(--line); }
  .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
  .footer-fix {
    position: fixed; left: 0; right: 0; bottom: 0; background: #fff;
    border-top: 1px solid var(--line); padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  }
  .footer-fix .inner { max-width: 480px; margin: 0 auto; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { flex: 1; background: #f4f7f5; color: var(--gray); border-radius: 10px; padding: 9px; }
  .tabs button.on { background: var(--green); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--gray); font-weight: 600; font-size: 12px; }
  .list-item { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list-item .name { flex: 1; font-weight: 600; }
  .list-item .date { color: var(--gray); font-size: 13px; }
  .muted { color: var(--gray); }
  .err { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .ok-box { text-align: center; padding: 40px 20px; }
  .ok-box .big { font-size: 40px; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: #1a2621; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: .95; }
  .hidden { display: none !important; }
  .chip { display:inline-block; background:#f4f7f5; border-radius:8px; padding:3px 8px; font-size:12px; color:var(--gray); }
</style>

  <style>
    .cake-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cake-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; }
    .cake-card.on { border-color: var(--green-btn); box-shadow: 0 0 0 1px var(--green-btn) inset; }
    .cake-card .cname { font-weight: 600; font-size: 14px; }
    .cake-card .cprice { color: var(--gray); font-size: 12px; }
    .seg { display: flex; gap: 6px; }
    .seg button { flex: 1; background: #f4f7f5; color: var(--gray); border-radius: 9px; padding: 9px; }
    .seg button.on { background: var(--green); color: #fff; }
    .opt { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .opt input { width: auto; }
    .opt .op-name { flex: 1; }
    .sum { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
    .sum.total { font-weight: 700; font-size: 16px; }
    .tmpl { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .tmpl button { background: #f4f7f5; color: var(--green); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap" id="app" style="display:none">
    <header class="app"><span class="logo">🎂 CAKEME</span></header>
    <h1 id="title">誕生日ケーキの注文</h1>
    <p class="note" id="target"></p>

    <h2>ケーキ</h2>
    <div class="cake-grid" id="cakes"></div>

    <h2>サイズ</h2>
    <div class="seg" id="sizes"></div>

    <h2>メッセージプレート</h2>
    <div class="field">
      <input id="plateText" type="text" maxlength="40" placeholder="Happy Birthday!">
      <div class="tmpl" id="tmpls"></div>
    </div>
    <div class="field">
      <label><input type="checkbox" id="logo" style="width:auto;vertical-align:-2px"> 会社ロゴプレートを付ける</label>
    </div>

    <h2>オプション</h2>
    <div id="options"></div>

    <h2>お届け</h2>
    <div class="field"><label>配達先</label><select id="siteId"></select></div>
    <div class="field"><label>時間帯</label><select id="timeWindow"></select></div>
    <p class="note" id="delivery-date"></p>

    <div id="err" class="err hidden"></div>
  </div>

  <div class="footer-fix" id="footer" style="display:none">
    <div class="inner">
      <div class="sum"><span>小計</span><span id="s-sub">0 THB</span></div>
      <div class="sum"><span>配送料</span><span id="s-fee">0 THB</span></div>
      <div class="sum total"><span>合計</span><span id="s-total">0 THB</span></div>
      <button class="btn-primary" id="confirm" style="margin-top:8px">注文を確定する</button>
    </div>
  </div>

  <div class="wrap ok-box hidden" id="done">
    <div class="big">✅</div><h1>注文を確定しました</h1>
    <p class="note" id="done-msg"></p>
    <button class="btn-primary" onclick="CAKEME.close()">閉じる</button>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="./config.js"></script><script src="./shared_liff_web.js"></script>
  <script>
    var D = null, state = { cakeId: '', size: '', options: [], freeMin: 1500 };
    // draft はサーバーが liff.state を解決して注入（location.search はLIFFでは liff.state になり取れないため）
    var LIFF_PARAMS = null;
    var draftId = (LIFF_PARAMS && LIFF_PARAMS.draft) || new URLSearchParams(location.search).get('draft');

    CAKEME.init(function () {
      if (!draftId) { showFatal('注文が指定されていません'); return; }
      CAKEME.call('getOrderDraft', { draftId: draftId }).then(function (d) {
        D = d;
        if (!d.editable) { showFatal('この注文はすでに確定/処理済みです'); return; }
        setup();
      }).catch(function (e) { showFatal(e.message); });
    });

    function setup() {
      var o = D.order;
      state.cakeId = o.cakeId; state.size = o.size;
      state.options = (o.options || []).slice(); state.freeMin = D.freeDeliveryMin;
      document.getElementById('target').textContent = o.employeeName + ' さん / お届け ' + o.deliveryDate;
      document.getElementById('delivery-date').textContent = '配達日: ' + o.deliveryDate + '（固定）';
      document.getElementById('plateText').value = o.plateText || '';
      document.getElementById('logo').checked = !!o.logo;

      // ケーキ
      document.getElementById('cakes').innerHTML = D.menu.map(function (m) {
        var minP = Math.min.apply(null, m.sizes.map(function (s) { return s.price; }));
        return '<div class="cake-card" data-cake="' + esc(m.cakeId) + '">' +
          '<div class="cname">' + esc(m.name) + '</div>' +
          '<div class="cprice">' + minP + ' THB〜</div></div>';
      }).join('');
      document.querySelectorAll('[data-cake]').forEach(function (el) {
        el.addEventListener('click', function () { state.cakeId = el.getAttribute('data-cake'); renderCakeSel(); renderSizes(); recalc(); });
      });

      // プレート定型文
      document.getElementById('tmpls').innerHTML = (D.plateTemplates || []).map(function (t) {
        return '<button data-tmpl="' + esc(t) + '">' + esc(t) + '</button>';
      }).join('');
      document.querySelectorAll('[data-tmpl]').forEach(function (b) {
        b.addEventListener('click', function () { document.getElementById('plateText').value = b.getAttribute('data-tmpl'); });
      });

      // オプション
      document.getElementById('options').innerHTML = D.options.map(function (op) {
        var on = state.options.indexOf(op.optionId) !== -1;
        return '<label class="opt"><input type="checkbox" data-opt="' + esc(op.optionId) + '"' + (on ? ' checked' : '') + '>' +
          '<span class="op-name">' + esc(op.name) + '</span><span class="muted">+' + op.price + '</span></label>';
      }).join('');
      document.querySelectorAll('[data-opt]').forEach(function (c) {
        c.addEventListener('change', function () {
          var id = c.getAttribute('data-opt');
          if (c.checked) { if (state.options.indexOf(id) === -1) state.options.push(id); }
          else { state.options = state.options.filter(function (x) { return x !== id; }); }
          recalc();
        });
      });

      // 配達先・時間帯
      document.getElementById('siteId').innerHTML = D.sites.map(function (s) {
        return '<option value="' + esc(s.siteId) + '">' + esc(s.siteName) + '</option>';
      }).join('') || '<option value="">（拠点未登録）</option>';
      document.getElementById('siteId').value = o.siteId || '';
      document.getElementById('siteId').addEventListener('change', recalc);
      document.getElementById('timeWindow').innerHTML = (D.timeWindows || []).map(function (t) {
        return '<option value="' + esc(t) + '">' + esc(t) + '</option>';
      }).join('');
      document.getElementById('timeWindow').value = o.timeWindow || '';

      renderCakeSel(); renderSizes(); recalc();
      document.getElementById('app').style.display = '';
      document.getElementById('footer').style.display = '';
    }

    function renderCakeSel() {
      document.querySelectorAll('[data-cake]').forEach(function (el) {
        el.classList.toggle('on', el.getAttribute('data-cake') === state.cakeId);
      });
    }
    function renderSizes() {
      var m = D.menu.filter(function (x) { return x.cakeId === state.cakeId; })[0];
      var sizes = m ? m.sizes : [];
      if (!sizes.some(function (s) { return s.size === state.size; })) state.size = sizes[0] ? sizes[0].size : '';
      document.getElementById('sizes').innerHTML = sizes.map(function (s) {
        return '<button data-size="' + esc(s.size) + '">' + esc(s.size) + '<br><span style="font-size:11px">' + s.serves + '名</span></button>';
      }).join('');
      document.querySelectorAll('[data-size]').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-size') === state.size);
        b.addEventListener('click', function () { state.size = b.getAttribute('data-size'); renderSizes(); recalc(); });
      });
    }

    // クライアント側は表示用の概算のみ。確定時はサーバーが再計算（R8）。
    function recalc() {
      var m = D.menu.filter(function (x) { return x.cakeId === state.cakeId; })[0];
      var sub = 0;
      if (m) { var sz = m.sizes.filter(function (s) { return s.size === state.size; })[0]; if (sz) sub += sz.price; }
      state.options.forEach(function (id) {
        var op = D.options.filter(function (o) { return o.optionId === id; })[0]; if (op) sub += op.price;
      });
      var siteId = document.getElementById('siteId').value;
      var site = D.sites.filter(function (s) { return s.siteId === siteId; })[0];
      var fee = (site && site.deliveryFee !== '' && site.deliveryFee != null) ? Number(site.deliveryFee) : 0;
      if (sub >= state.freeMin) fee = 0;
      document.getElementById('s-sub').textContent = sub + ' THB';
      document.getElementById('s-fee').textContent = fee + ' THB';
      document.getElementById('s-total').textContent = (sub + fee) + ' THB';
    }

    document.getElementById('confirm').addEventListener('click', function () {
      var btn = this;
      var changes = {
        cakeId: state.cakeId, size: state.size, options: state.options,
        plateText: document.getElementById('plateText').value.trim(),
        logo: document.getElementById('logo').checked,
        siteId: document.getElementById('siteId').value,
        timeWindow: document.getElementById('timeWindow').value
      };
      CAKEME.withLoading(btn, function () {
        return CAKEME.call('confirmOrder', { draftId: draftId, changes: changes }).then(function (res) {
          document.getElementById('app').style.display = 'none';
          document.getElementById('footer').style.display = 'none';
          document.getElementById('done').classList.remove('hidden');
          document.getElementById('done-msg').textContent = '注文番号 ' + res.orderId + ' / 合計 ' + res.total + ' THB';
        });
      });
    });

    function showFatal(m) { document.body.innerHTML = '<div class="wrap"><header class="app"><span class="logo">🎂 CAKEME</span></header><p class="err">' + esc(m) + '</p><button class="btn-ghost" onclick="CAKEME.close()">閉じる</button></div>'; }
  </script>
</body>
</html>
